[package]
name = "flowrs"
version = "0.3.0"
edition = "2021"
authors = ["wuermseer.florian@gmail.com", "markus.friedrich@hm.edu"]
description = "A generic and Type-Safe WASM library for Flow-Based Programming."
repository = "https://github.com/flow-rs/flowrs"
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/flowrs"
keywords = ["flow", "fbp", "wasm", "flow-package"]
categories = ["data-structures", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flowrs-derive = { git = "https://github.com/flow-rs/flowrs-derive", branch = "main" }
flowrs-package = { git = "https://github.com/flow-rs/flowrs-package", branch = "main" }

serde = { version = "1.0.184", features = ["derive", "rc"] }
serde_json = "1.0.100"
thiserror = "1.0.44"
anyhow = "1.0"
crossbeam-channel = "0.5.8"
web-time = "0.2.0"
cfg-if = "1.0.0"
async-trait = "0.1"
futures = "0.3"
lazy_static = "1.5.0"
paste = "1.0"
log = "0.4.20"
tracing = "0.1.40"
aho-corasick = "1.1.3"

# Optional dependencies (still feature-gated)
reqwest = { version = "0.11.22", features = ["blocking", "json"], optional = true }
futures-core = { version = "0.3.29", optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", optional = true }
opentelemetry-stdout = { version = "0.2.0", features = ["trace"], optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
tracing-subscriber = { version = "0.3.18", optional = true }
tracing-log = { version = "0.2.0", optional = true }
metrics = { version = "0.21.1", optional = true }
metrics-exporter-prometheus = { version = "0.12.1", default-features = false, features = ["push-gateway"], optional = true }

# Native build
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
env_logger = "0.10"

# WASM build
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.37"

[features]
default = ["native"]

native = [
    "reqwest",
    "futures-core",
    "tracing-opentelemetry",
    "tracing-subscriber",
    "tracing-log",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-stdout",
    "metrics",
    "metrics-exporter-prometheus"
]

wasm = []
