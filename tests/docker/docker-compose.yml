services:
  build-runner:
    build:
      context: ../../../
      dockerfile: /flowrs/tests/docker/Dockerfile.runner.build
    environment:
      - RUST_BACKTRACE=1
    volumes:
      - ./docker/output1:/output   # Store the compiled runner in the output folder
    
  build-library:
    build:
      context: ../../../
      dockerfile: /flowrs/tests/docker/Dockerfile.lib.build
    environment:
      - RUST_BACKTRACE=1
    volumes:
      - ./docker/output1:/output   # Store the compiled library in the output folder

  base-runtime:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.test
    volumes:
      - ./docker/output:/output
    networks:
      - test-net
    environment:
      - LD_LIBRARY_PATH=/output
      - RUST_BACKTRACE=1
    entrypoint: /bin/true  # No-op container for sharing base image

  orchestrator:
    image: docker-base-runtime
    command: ["--role", "orchestrator", "--flow", "/output/libflow_project.so"]
    # depends_on:
    #   - nodert1
    #   - nodert2
    networks:
      - test-net
    # ports: 
    #   - "5000:5000"
    #   - "4999:4999"
    environment:
    - RUST_BACKTRACE=1

  nodert1:
    image: docker-base-runtime
    command: ["--role", "node-runtime", "--flow", "/output/libflow_project.so", "--runtime-id", "1"]
    networks:
      - test-net
    # ports: 
    #   - "5001:5000"
    environment:
    - RUST_BACKTRACE=1

  nodert2:
    image: docker-base-runtime
    command: ["--role", "node-runtime", "--flow", "/output/libflow_project.so", "--runtime-id", "2"]
    networks:
      - test-net
    # ports: 
    #   - "5002:5000"
    environment:
    - RUST_BACKTRACE=1

networks:
  test-net:
    driver: bridge